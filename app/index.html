<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- 保険の CSP（04a 小16）。読むのは自分のファイル・Google ログイン（GIS）・サーバー（config.js の apiUrl＝script.google.com）だけ。
     インラインの script は使わない（GIS の読み込み完了は auth.js が load で受ける）。GIS のボタンの見た目のため style は Google の分と inline を許す -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>金木犀舎 名簿</title>
<link rel="stylesheet" href="css/app.css">
<link id="page-landscape" rel="stylesheet" href="css/print-landscape.css" media="not all">
</head>
<body>
<header class="topbar np">
  <div class="brand">金木犀舎 名簿</div>
  <div class="who-box">
    <span id="who"></span>
    <span class="who-gap"></span>
    <button id="logout" class="btn small logout" type="button" hidden>ログアウト</button>
  </div>
</header>
<div id="banner" class="banner np" hidden></div>
<nav id="nav" class="nav np" aria-label="画面の切り替え"></nav>

<section id="login" class="login np" hidden>
  <h1>ログイン</h1>
  <p>「Googleでログイン」を押して、教室に登録したGoogleアカウントを選んでください。</p>
  <p id="login-reason" class="login-reason" role="alert" hidden></p>
  <p id="login-keep" class="login-keep" hidden></p>
  <div id="gbtn" class="gbtn"></div>
</section>

<main id="view"></main>

<div id="modal" class="modal np" hidden></div>
<div id="toast" class="toast np" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/views.js"></script>
<script src="js/adminviews.js"></script>
<script src="js/opsviews.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/teacher.js"></script>
<script src="js/note.js"></script>
<script src="js/roster.js"></script>
<script src="js/dayroster.js"></script>
<script src="js/history.js"></script>
<script src="js/student.js"></script>
<script src="js/schedule.js"></script>
<script src="js/contact.js"></script>
<script src="js/course.js"></script>
<script src="js/settings.js"></script>
<script src="js/makeup.js"></script>
<script src="js/ticket.js"></script>
<script src="js/review.js"></script>
<script src="js/continuation.js"></script>
<script src="js/home.js"></script>
<script id="gis-client" src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
