<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>金木犀舎 名簿</title>

<body>
<header class="topbar np">
  <div class="brand">金木犀舎 名簿</div>
  <div class="who-box">
    <span id="who"></span>
    <span id="recorder" hidden></span>
    <button id="logout" class="btn" type="button" hidden>ログアウト</button>
  </div>
</header>
<div id="banner" class="banner np" hidden></div>
<nav id="nav" class="nav np" aria-label="画面の切り替え"></nav>

<section id="login" class="login np" hidden>
  <h1>ログイン</h1>

  <p id="login-reason" class="login-reason" role="alert" hidden></p>
  <p id="login-keep" class="login-keep" hidden></p>
  <div id="gbtn" class="gbtn"></div>
</section>

<main id="view"></main>

<div id="modal" class="modal np" hidden></div>
<div id="toast" class="toast np" role="status" aria-live="polite"></div>

<script src="config.js"></script>

<script src="js/ticket.js"></script>
<script src="js/review.js"></script>
